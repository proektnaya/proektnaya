  <script>
  const people = {

    m:{name:'М',role:'ЧЕЛОВЕКР',img:'EMA_1.png',intro:'Его к власти не пускать, иначе кого он будет ненавидеть?',stats:[['0','суток отсижено'],['1 млн мощи','в аутизме-похеризме'],['7','отказов девушек']],achievements:['Оппозиционер','Был в ВДЦ "Орлёнок"','Финалист всероссийского конкурса по робототехнике "Hello pioneer! 2025-2026"']},

  };
  const key=new URLSearchParams(location.search).get('id')||'e', p=people[key]||people.alexey;
  //document.title=p.name+' — Портфолио';
  document.getElementById('profile').innerHTML=`

    <div class="profile-grid">
      <div class="profile-photo frame reveal"><div class="photo-code">PERSON / ${p.year}</div><img src="${p.img}" alt="${p.name}"></div>
